
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小一學堂 - 快樂學習趣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF85A1; /* 甜心粉 */
            --secondary-color: #64DFDF; /* 薄荷綠 */
            --accent-color: #FFB347; /* 活力橙 */
            --bg-color: #FFF9F0;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#FFD1DC 1px, transparent 1px);
            background-size: 25px 25px;
        }
        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .bouncing {
            animation: bounce-subtle 3s ease-in-out infinite;
        }
        /* 精美注音樣式 */
        ruby {
            ruby-align: center;
            ruby-position: over;
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            vertical-align: middle;
            margin: 0 0.12em;
        }
        rt {
            font-size: 0.45em;
            color: #6b7280;
            font-weight: 500;
            line-height: 1;
            display: block;
            margin-bottom: 0.35em;
            letter-spacing: 0.05em;
        }
        .custom-card {
            border: 5px solid white;
            border-radius: 2.5rem;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn-shadow-pink {
            border-bottom: 6px solid #e66a85;
        }
        .btn-shadow-mint {
            border-bottom: 6px solid #48c1c1;
        }
    </style>
